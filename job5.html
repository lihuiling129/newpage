<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>XX电商·运营后台·订单录入与销售看板</title>
    <!-- 引入Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif;}
        .box { border:1px solid #ddd; padding:10px; margin:10px 0;}
        .clock { font-size: 20px; font-weight:bold; color: #336699;}
        label { display:inline-block; width:120px;}
        table { border-collapse: collapse; width:100% ; margin-top:10px; }
        th, td { border:1px solid #ccc; padding:4px 8px; text-align:center; }
        /* 优化提示框样式，保留蓝色边框+添加图标容器 */
        .tip-box {
            padding:12px; 
            margin:10px 0; 
            font-size:14px;
            border-left:5px solid #3aa0e6;
            background:#eef9ff;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .tip-box .icon {
            color: #3aa0e6;
            font-size: 18px;
            margin-top: 2px;
        }
        .tip-box-content {
            flex: 1;
        }
        /* 时段提示框样式统一 */
        .time-tip-box {
            padding:12px; 
            margin:10px 0; 
            font-size:14px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            border-left:5px solid #f4d06f;
            background:#fffbe6;
        }
        .time-tip-box.gray {
            border-left-color: #ccc;
            background:#f5f5f5;
        }
        .time-tip-box .icon {
            font-size: 18px;
            margin-top: 2px;
            color: #f4d06f;
        }
        .time-tip-box.gray .icon {
            color: #ccc;
        }
    </style>
</head>
<body>
    <script>
        // 第一部分：页面头部与优惠提示（保留蓝色框+添加图标）
        document.write("<h1>XX电商·运营后台·订单录入与销售看板</h1>");
        document.write("<p>欢迎使用内部工具, 实时查看订单与销售情况。</p>");
        document.write(`
        <div class="tip-box">
            <div class="icon"><i class="fas fa-info-circle"></i></div>
            <div class="tip-box-content">
                <strong>温馨提示: 本店当前可享受的优惠与加价政策如下:</strong>
                <ul style="margin:8px 0 20px; line-height:1.6;">
                    <li>VIP 客户享受<strong>9 折优惠</strong></li>
                    <li>加急发货价格会<strong>×1.1</strong></li>
                    <li>每小时前10 分钟再享 <strong>8.5 折</strong></li>
                </ul>
            </div>
        </div>`);

        // 时段折扣提示（保留样式+添加图标）
        var nowForBanner = new Date();
        var minuteForBanner=nowForBanner.getMinutes(); 
        if (minuteForBanner >=0 && minuteForBanner <=9){
            document.write(`
            <div class="time-tip-box">
                <div class="icon"><i class="fas fa-clock"></i></div>
                <div>
                    当前为前 10 分钟! 本单可额外享受<strong>8.5 折</strong>时段优惠!
                </div>
            </div>`);
        } else {
            document.write(`
            <div class="time-tip-box gray">
                <div class="icon"><i class="fas fa-lightbulb"></i></div>
                <div>
                    小贴士:每个整点前10 分钟享受 8.5 折优惠,请留意下单时间~
                </div>
            </div>`);
        }
    </script>

    <!-- 模拟时钟展示区域 -->
    <div class="clock" id="clock"></div>

    <!-- 订单录入表单 -->
    <div class="box">
        <h3>新建订单</h3>
        <form onsubmit="return validateForm()">
            <p>
                <label>客户名称:</label>
                <input type="text" id="customerName" placeholder="请输入客户名称">
            </p>
            <p>
                <label>商品单价(¥):</label>
                <input type="number" id="priceInput" placeholder="请输入商品单价" step="0.01">
            </p>
            <p>
                <label>数量(件):</label>
                <input type="number" id="qtyInput" placeholder="请输入购买数量" min="1">
            </p>
            <p>
                <label>客户类型:</label>
                <select id="customerType">
                    <option value="normal">普通客户</option>
                    <option value="vip">VIP客户</option>
                </select>
            </p>
            <p>
                <label>加急发货:</label>
                <input type="checkbox" id="urgentFlag"> 是
            </p>
            <p>
                <button type="submit">添加订单</button>
            </p>
        </form>
    </div>

    <!-- 订单结果展示 -->
    <div id="orderResult" class="box"></div>

    <!-- 销售看板 -->
    <div class="box">
        <h3>销售看板</h3>
        <div id="dashboard"></div>
        <div id="orderTable"></div>
    </div>

    <script>
        // 第二部分：模拟时钟功能
        function padZero(n){
            return n <10?"0"+n: n;
        }
        function updateClock(){
            var now = new Date();
            var y = now.getFullYear();
            var m= now.getMonth()+1;
            var d = now.getDate();
            var hh = now.getHours();
            var mm= now.getMinutes();
            var ss = now.getSeconds();
            var weekNames =["日","一","二","三","四","五","六"];
            var w = weekNames [now.getDay()];
            var timeStr = y+"年"+padZero(m)+"月"+ padZero(d)+"日 星期"+w+" "+padZero(hh) +":"+ padZero(mm)+":"+padZero(ss);
            document.getElementById("clock").innerHTML = timeStr;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 订单数组，存储历史订单
        var orders = [];

        // 初始化销售看板（页面加载时就显示0值）
        renderDashboard();

        // 第三部分：表单校验
        function validateForm(){
            var nameStr = document.getElementById("customerName").value;
            var priceStr = document.getElementById("priceInput").value;
            var qtyStr = document.getElementById("qtyInput").value;
            var typeStr = document.getElementById("customerType").value;
            var urgentChecked = document.getElementById("urgentFlag").checked;
            var valid = true;

            // 客户名称校验
            if (nameStr == null || nameStr.trim()===""){
                alert("客户名称不能为空!");
                valid = false;
            }

            // 商品单价校验
            var price =parseFloat(priceStr);
            if (isNaN(price) || price <=0){
                alert("商品单价必须是大于 0 的数字!");
                valid = false;
            }

            // 数量校验
            var qty = parseInt(qtyStr, 10);
            if (isNaN(qty) || qty <=0){
                alert("数量必须是大于0 的整数!");
                valid = false;
            }

            if (!valid){
                document.getElementById("orderResult").innerHTML = "<p>订单录入失败, 请检查输入。</p>";
                return false;
            }

            // 校验通过，处理订单
            processOrder(nameStr.trim(), price, qty, typeStr === "vip", urgentChecked);
            // 渲染销售看板
            renderDashboard();
            return false;
        }

        // 第四部分：订单处理与折扣计算（适配学号末位5的规则）
        function processOrder(customerName, price, quantity, isVip, isUrgent) {
            var baseTotal = price * quantity;
            var afterVip = isVip ? baseTotal * 0.9 : baseTotal;
            var afterUrgent = isUrgent ? afterVip * 1.1 : afterVip;
            var now = new Date();
            var minute = now.getMinutes();
            var hitTimeDiscount = false;
            var finalTotal = afterUrgent;

            // 基础时段折扣（前10分钟85折）
            if (minute >=0 && minute<=9){
                finalTotal *=0.85;
                hitTimeDiscount= true;
            }

            // 学号末位5的特殊规则：前10分钟且购买数量≥5件，叠加8折
            if (hitTimeDiscount && quantity >= 5) {
                finalTotal = finalTotal * 0.8;
            }

            // 订单类型判断
            var isImportant =isVip && finalTotal >1000;

            // 优惠详情拼接
            var tipsHtml ="<ul>";
            tipsHtml += isVip ? "<li>VIP 9折已应用</li>":"<li>普通客户无VIP 优惠</li>";
            tipsHtml += isUrgent? "<li>加急 ×1.1 已应用</li>":"<li>未加急</li>";
            tipsHtml += hitTimeDiscount? "<li>命中前10分钟×0.85</li>":"<li>无时段折扣</li>";
            if (hitTimeDiscount && quantity >=5) {
                tipsHtml += "<li>叠加数量≥5件额外8折</li>";
            }
            tipsHtml +="</ul>";

            // 结果展示
            document.getElementById("orderResult").innerHTML = 
                "<h3>订单录入成功:</h3>"+
                "<p>客户名称:"+ customerName + "</p>"+
                "<p>基础金额: ¥"+ baseTotal.toFixed(2) +"</p>"+
                "<p>VIP 后:¥"+ afterVip.toFixed(2) +"</p>"+
                "<p>加急后:¥"+ afterUrgent.toFixed(2)+"</p>"+
                "<p>最终金额: ¥"+ finalTotal.toFixed(2)+"</p>"+
                "<p>订单类型:"+(isImportant?"大额 VIP":"普通订单")+"</p>"+
                "<div style='background:#eef; padding:8px; '>优惠详情:"+ tipsHtml + "</div>";

            // 订单存入数组
            orders.push({
                name: customerName,
                price: price,
                qty: quantity,
                baseTotal: baseTotal,
                finalTotal: finalTotal,
                isVip: isVip,
                isUrgent: isUrgent,
                hitTimeDiscount: hitTimeDiscount
            });
        }

        // 第五部分：销售看板渲染（未添加订单时显示0，修复表头语法错误）
        function renderDashboard(){
            var count = orders.length;
            var totalSales =0;
            for (var i=0; i<orders.length; i++) {
                totalSales += orders[i].finalTotal;
            }
            // 平均客单价：无订单时显示0，避免NaN
            var avg = count >0? (totalSales / count).toFixed(2) : 0;

            // 渲染看板核心数据（无订单时显示0）
            document.getElementById("dashboard").innerHTML = 
                "<p>订单数:"+ count +"</p>"+
                "<p>销售总额: ¥"+ totalSales.toFixed(2)+"</p>"+
                "<p>平均客单价: ¥"+ avg +"</p>";

            // 渲染订单表格：无订单时显示空表格（仅表头）
            var tableHtml ="<table><tr>"+
                "<th>客户名称</th><th>单价</th><th>数量</th><th>基础金额</th><th>最终金额</th><th>VIP</th>"+
                "<th>加急</th><th>时段折扣</th></tr>";
            
            // 有订单时渲染数据行，无订单时不添加任何行
            for (var j=0; j<orders.length;j++){
                var o= orders[j];
                tableHtml += "<tr>"+
                    "<td>" + o.name +"</td>"+
                    "<td>" + o.price.toFixed(2)+"</td>"+
                    "<td>" + o.qty +"</td>"+
                    "<td>" + o.baseTotal.toFixed(2) +"</td>"+
                    "<td>" + o.finalTotal.toFixed(2) +"</td>"+
                    "<td>"+(o.isVip ?"是":"否")+"</td>"+
                    "<td>"+ (o.isUrgent?"是":"否")+"</td>"+
                    "<td>"+(o.hitTimeDiscount?"是":"否")+"</td>"+
                    "</tr>";
            }
            tableHtml +="</table>";
            document.getElementById("orderTable").innerHTML = tableHtml;
        }
    </script>
</body>
</html>
